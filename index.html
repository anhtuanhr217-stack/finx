  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f0f2f5;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      width: 100%;
      max-width: 100vw;
      position: relative;
    }
    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:4px;}
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
    @keyframes slideUp{from{transform:translateY(80px);opacity:0;}to{transform:translateY(0);opacity:1;}}
    @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
    @keyframes pulseGlow{0%,100%{box-shadow:0 0 15px rgba(6,182,212,0.25);}50%{box-shadow:0 0 25px rgba(16,185,129,0.4);}}
    .fade-up{animation:fadeUp .4s ease forwards;}
    .slide-up{animation:slideUp .35s cubic-bezier(.34,1.56,.64,1) forwards;}
    .fade-in{animation:fadeIn .15s ease forwards;}
    .ai-glow{animation:pulseGlow 3s infinite;}
    .modal-blur{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);}
    .card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);}
    .btn-primary{background:#1d4ed8;color:#fff;border:none;cursor:pointer;font-weight:600;transition:background .2s;}
    .btn-primary:hover{background:#1e40af;}
    .btn-dark{background:#111827;color:#fff;border:none;cursor:pointer;font-weight:600;transition:background .2s;}
    .btn-dark:hover{background:#374151;}
    .btn-outline{background:#fff;color:#374151;border:1.5px solid #e5e7eb;cursor:pointer;font-weight:500;transition:all .2s;}
    .btn-outline:hover{border-color:#9ca3af;}
    .status-done{background:#dcfce7;color:#15803d;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .status-cancel{background:#fee2e2;color:#dc2626;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .status-pending{background:#fef9c3;color:#a16207;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;}
    .cat-scroll{max-height:200px;overflow-y:auto;}
    .no-scroll::-webkit-scrollbar{display:none;}
    select{cursor:pointer;}
  </style>
  <script>tailwind.config={theme:{extend:{fontFamily:{inter:['Inter','sans-serif']}}}}</script>
</head>

    const newTx={...tx,id:'tx_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),method:tx.method||'Tiền mặt',status:'done'};
    txs.unshift(newTx);this.saveTxs(txs);
    const ws=wallets.map(w=>w.id===tx.walletId?{...w,balance:w.balance+(tx.type==='income'?tx.amount:-tx.amount)}:w);
    this.saveWallets(ws);

  addBatchTxs(batchTxs,wallets){
    const txs=this.getTransactions();
    const newTxs=batchTxs.map(t=>({
      ...t,
      id:'tx_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),
      method:t.method||'Tiền mặt',
      status:'done'
    }));
    const updatedTxs=[...newTxs,...txs];
    this.saveTxs(updatedTxs);

    const deltas={};
    newTxs.forEach(t=>{
      const delta=t.type==='income'?t.amount:-t.amount;
      deltas[t.walletId]=(deltas[t.walletId]||0)+delta;
    });
    const ws=wallets.map(w=>deltas[w.id]?{...w,balance:w.balance+deltas[w.id]}:w);
    this.saveWallets(ws);
    return{txs:updatedTxs,wallets:ws,count:newTxs.length};
  },
  deleteTx(id,wallets){
    const txs=this.getTransactions();
    const tx=txs.find(t=>t.id===id);if(!tx)return{txs,wallets};
    const updated=txs.filter(t=>t.id!==id);this.saveTxs(updated);
    const ws=wallets.map(w=>w.id===tx.walletId?{...w,balance:w.balance+(tx.type==='income'?-tx.amount:tx.amount)}:w);
    this.saveWallets(ws);
    return{txs:updated,wallets:ws};
  },
  updateTx(newTx,wallets){
    const txs=this.getTransactions();
    const old=txs.find(t=>t.id===newTx.id);if(!old)return{txs,wallets};
    const updated=txs.map(t=>t.id===newTx.id?newTx:t);this.saveTxs(updated);
    const ws=wallets.map(w=>{
      let b=w.balance;
      if(w.id===old.walletId)b+=(old.type==='income'?-old.amount:old.amount);
      if(w.id===newTx.walletId)b+=(newTx.type==='income'?newTx.amount:-newTx.amount);
      return{...w,balance:b};
    });
    this.saveWallets(ws);
    return{txs:updated,wallets:ws};
  },
};

const GEMINI_STORAGE_KEY = 'finix_gemini_api_key';

const GeminiAIService = {

  removeKey(){localStorage.removeItem(GEMINI_STORAGE_KEY);},
  async testKey(key){

    const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${targetKey}`;
    const res=await fetch(endpoint,{
      method:'POST',

    });
    if(!res.ok){

    }
    return true;
  },
  parseOfflineMock(text,wallets,categories){
    const list=[];
    const phrases=text.split(/[,;\n\+]| và /i).map(s=>s.trim()).filter(Boolean);
    const parseVNMoney=(str)=>{
      const lower=str.toLowerCase();
      const trMatch=lower.match(/(\d+(?:[\.,]\d+)?)\s*(?:tr|triệu|củ|chai)/);
      if(trMatch) return Math.round(parseFloat(trMatch[1].replace(',','.'))*1000000);
      const kMatch=lower.match(/(\d+(?:[\.,]\d+)?)\s*(?:k|ngàn|nghìn)/);
      if(kMatch) return Math.round(parseFloat(kMatch[1].replace(',','.'))*1000);
      const xiMatch=lower.match(/(\d+)\s*xị/);
      if(xiMatch) return parseInt(xiMatch[1],10)*100000;
      const lopMatch=lower.match(/(\d+)\s*lốp/);
      if(lopMatch) return parseInt(lopMatch[1],10)*100000;
      const numMatch=lower.match(/(\d[\d\.\,]*)/);
      if(numMatch){
        const clean=numMatch[1].replace(/[\.,]/g,'');
        return parseInt(clean,10)||0;
      }
      return 0;
    };

    phrases.forEach(phrase=>{
      const amt=parseVNMoney(phrase);
      if(amt<=0)return;
      const lower=phrase.toLowerCase();
      const isIncome=/(lương|thưởng|thu|được cho|hoàn tiền|lãi|bán đồ|nhận tiền)/i.test(lower);
      const type=isIncome?'income':'expense';

      let catId=isIncome?'inc_salary':'exp_food';
      if(isIncome){
        if(/thưởng|kpi/i.test(lower)) catId='inc_bonus';
        else if(/đầu tư|chứng khoán|lãi/i.test(lower)) catId='inc_invest';
        else if(/lương/i.test(lower)) catId='inc_salary';
        else catId='inc_other';
      }else{
        if(/xăng|xe|grab|be|taxi|tàu|vé xe/i.test(lower)) catId='exp_move';
        else if(/nhà|thuê nhà|phòng trọ/i.test(lower)) catId='exp_home';
        else if(/áo|quần|giày|mua|shop|uniqlo|shopee|tiki/i.test(lower)) catId='exp_shop';
        else if(/phim|game|karaoke|bar|chơi/i.test(lower)) catId='exp_fun';
        else if(/điện|nước|net|internet|hóa đơn|wifi/i.test(lower)) catId='exp_bill';
        else if(/thuốc|khám|bệnh|y tế/i.test(lower)) catId='exp_health';
        else if(/học|khóa học|sách/i.test(lower)) catId='exp_edu';
        else catId='exp_food';
      }

      let walletId=wallets[0]?.id||'w1';
      let method='Tiền mặt';
      if(/vietcombank|ngân hàng|vcb|chuyển khoản|ck|momo/i.test(lower)){
        const bankW=wallets.find(w=>w.type==='bank')||wallets[1]||wallets[0];
        walletId=bankW.id; method=bankW.name;
      }else if(/thẻ|tín dụng|credit|visa|quẹt/i.test(lower)){
        const creditW=wallets.find(w=>w.type==='credit')||wallets[2]||wallets[0];
        walletId=creditW.id; method=creditW.name;
      }else{
        const cashW=wallets.find(w=>w.type==='cash')||wallets[0];
        walletId=cashW.id; method='Tiền mặt';
      }

      let note=phrase
        .replace(/\b(?:bằng|qua|dùng|vào|quẹt)\s+(?:tiền mặt|chuyển khoản|ngân hàng|thẻ|visa|vcb|momo)\b/gi,'')
        .replace(/\b\d+(?:[\.,]\d+)?\s*(?:k|ngàn|nghìn|tr|triệu|củ|chai|xị|lốp|đ|vnd)\b/gi,'')
        .replace(/\b\d[\d\.\,]*\b/g,'')
        .trim();
      if(!note) note=isIncome?'Thu nhập':'Chi tiêu';

      list.push({
        amount:amt,
        type,
        categoryId:catId,
        walletId,
        method,
        note:note.charAt(0).toUpperCase()+note.slice(1),
        date:new Date().toISOString()
      });
    });

    return list;
  },
  async parseTransactions({ text, imageBase64, mimeType, wallets, categories }){
    const apiKey=this.getKey();
    if(!apiKey && !imageBase64){
      const parsed=this.parseOfflineMock(text,wallets,categories);

    }
    if(!apiKey){
      throw new Error('Chưa cấu hình Gemini API Key để phân tích ảnh. Vui lòng vào mục Cài đặt nhập Key!');
    }

    const endpoint=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
    const systemPrompt=`Bạn là trợ lý tài chính thông minh của ứng dụng Finix tại Việt Nam.
Nhiệm vụ của bạn là bóc tách mọi giao dịch thu/chi từ văn bản hoặc hình ảnh hóa đơn/chuyển khoản của người dùng thành định dạng JSON chuẩn.

THỜI GIAN HIỆN TẠI: ${new Date().toISOString()} (Thứ ${new Date().getDay()+1}, ngày ${new Date().toLocaleDateString('vi-VN')})

DANH SÁCH VÍ KHẢ DỤNG:
${JSON.stringify(wallets.map(w=>({id:w.id,name:w.name,type:w.type})))}

DANH SÁCH DANH MỤC KHẢ DỤNG:
${JSON.stringify(categories.map(c=>({id:c.id,name:c.name,type:c.type})))}

QUY TẮC BÓC TÁCH TIỀN TỆ TIẾNG VIỆT & TIẾNG LÓNG:
- "50k", "50 ngàn", "50 nghìn" = 50000
- "1tr2", "1.2tr", "1tr200", "1 triệu 2" = 1200000
- "1 củ", "1 chai" = 1000000; "nửa củ" = 500000
- "1 xị" = 100000; "2 xị" = 200000
- "1 lít", "1 loét" = 100000; "5 lốp" = 500000
- "1 vé" = 100000 hoặc 500000 tùy ngữ cảnh
- "amount" BẮT BUỘC là số nguyên VNĐ (integer > 0).

QUY TẮC SUY LUẬN:
- type: 'income' (thu nhập) hoặc 'expense' (chi tiêu).
- categoryId: Chọn 1 ID danh mục thích hợp nhất từ danh mục khả dụng.
- walletId: Chọn 1 ID ví phù hợp từ ví khả dụng.
- method: Tên phương thức tương ứng.
- note: Tên món/dịch vụ ngắn gọn, rõ ràng.
- date: Chuỗi ISO 8601.
- Nếu người dùng nhập nhiều giao dịch trong 1 câu, BẮT BUỘC TRẢ VỀ TẤT CẢ các giao dịch đó trong mảng!

ĐỊNH DẠNG TRẢ VỀ BẮT BUỘC:
Mảng JSON thuần. Không markdown.`;

    const parts=[];
    if(text) parts.push({text: `${systemPrompt}\n\nNỘI DUNG NGƯỜI DÙNG NHẬP:\n${text}`});
    else parts.push({text: `${systemPrompt}\n\nHãy đọc kỹ ảnh hóa đơn/chuyển khoản này và trích xuất tất cả các giao dịch tương ứng.`});

    if(imageBase64){
      parts.push({
        inlineData:{
          mimeType: mimeType||'image/jpeg',
          data: imageBase64
        }
      });
    }

    const payload={
      contents:[{parts}],
      generationConfig:{
        responseMimeType:'application/json',
        temperature:0.1
      }
    };

    const res=await fetch(endpoint,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    if(!res.ok){
      const err=await res.json().catch(()=>({}));
      throw new Error(err?.error?.message||`Gemini API lỗi (${res.status})`);
    }

    const data=await res.json();
    const rawText=data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!rawText) throw new Error('Không nhận được phản hồi từ Gemini API');

    let cleanJson=rawText.trim();
    if(cleanJson.startsWith('```json')) cleanJson=cleanJson.replace(/^```json/,'').replace(/```$/,'').trim();
    else if(cleanJson.startsWith('```')) cleanJson=cleanJson.replace(/^```/,'').replace(/```$/,'').trim();

    let parsed=[];
    try{
      const resObj=JSON.parse(cleanJson);
      if(Array.isArray(resObj)) parsed=resObj;
      else if(resObj && typeof resObj==='object'){
        if(Array.isArray(resObj.transactions)) parsed=resObj.transactions;
        else if(Array.isArray(resObj.data)) parsed=resObj.data;
        else parsed=[resObj];
      }
    }catch(err){
      const match=cleanJson.match(/\[[\s\S]*\]/);
      if(match) parsed=JSON.parse(match[0]);
      else throw new Error('Dữ liệu AI trả về không đúng chuẩn JSON');
    }

    const sanitized=parsed.map(item=>({
      amount: Math.abs(parseInt(item.amount,10)||0),
      type: item.type==='income'?'income':'expense',
      categoryId: categories.some(c=>c.id===item.categoryId)?item.categoryId:(item.type==='income'?'inc_salary':'exp_food'),
      walletId: wallets.some(w=>w.id===item.walletId)?item.walletId:(wallets[0]?.id||'w1'),
      method: item.method||'Tiền mặt',
      note: (item.note||'Giao dịch').trim(),
      date: item.date||new Date().toISOString()
    })).filter(t=>t.amount>0);

    return { transactions: sanitized, isOfflineDemo: false };
  }
};

  if(abs>=1000000){const m=abs/1000000;return(m%1===0?m.toFixed(0):m.toFixed(1))+'M đ';}
  if(abs>=1000){return Math.round(abs/1000)+'K đ';}
  return abs.toLocaleString('vi-VN')+' đ';
};

const CashflowChart = ({txs}) => {
  const ref=useRef(null);
  const chartRef=useRef(null);
  const data=useMemo(()=>{
    const now=new Date(),y=now.getFullYear(),m=now.getMonth();
    const months=[];
    for(let i=5;i>=0;i--){
      const d=new Date(y,m-i,1);
      const mn=d.getMonth(),yr=d.getFullYear();
      const label=['T1','T2','T3','T4','T5','T6','T7','T8','T9','T10','T11','T12'][mn];
      const inc=txs.filter(t=>t.type==='income'&&new Date(t.date).getMonth()===mn&&new Date(t.date).getFullYear()===yr).reduce((s,t)=>s+t.amount,0);
      const exp=txs.filter(t=>t.type==='expense'&&new Date(t.date).getMonth()===mn&&new Date(t.date).getFullYear()===yr).reduce((s,t)=>s+t.amount,0);
      months.push({label,inc:inc/1e6,exp:exp/1e6});
    }
    return months;
  },[txs]);

  useEffect(()=>{
    if(!ref.current)return;
    if(chartRef.current)chartRef.current.destroy();
    chartRef.current=new Chart(ref.current,{
      type:'bar',
      data:{
        labels:data.map(d=>d.label),
        datasets:[
          {label:'Thu nhập',data:data.map(d=>d.inc),backgroundColor:'#2563eb',borderRadius:{topLeft:6,topRight:6},maxBarThickness:28},
          {label:'Chi tiêu',data:data.map(d=>d.exp),backgroundColor:'#a3e635',borderRadius:{topLeft:6,topRight:6},maxBarThickness:28},
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{
          legend:{display:false},
          tooltip:{
            backgroundColor:'#111827',
            titleColor:'#fff',
            bodyColor:'#d1fae5',
            padding:12,
            cornerRadius:10,
            callbacks:{
              title:ctx=>{const mn=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];const now=new Date();const idx=data.findIndex(d=>d.label===ctx[0].label);const m=new Date(now.getFullYear(),now.getMonth()-5+idx,1);return mn[m.getMonth()]+' '+m.getFullYear();},
              label:ctx=>` ${ctx.dataset.label}: ${(ctx.raw||0).toFixed(1)}M đ`,
            }
          }
        },
        scales:{
          x:{grid:{display:false},ticks:{color:'#9ca3af',font:{size:12}}},
          y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#9ca3af',font:{size:11},callback:v=>v+'M'},border:{display:false}}
        }
      }
    });
    return()=>chartRef.current?.destroy();
  },[data]);

  return <div style={{height:200}}><canvas ref={ref}/></div>;
};

// ═══════════════════════════════════════════════════════════
// MINI BALANCE CHART
// ═══════════════════════════════════════════════════════════
const MiniBalanceChart = ({txs}) => {
  const data=useMemo(()=>{
    const days=[];
    for(let i=13;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const exp=txs.filter(t=>sameDay(t.date,d)&&t.type==='expense').reduce((s,t)=>s+t.amount,0);
      const inc=txs.filter(t=>sameDay(t.date,d)&&t.type==='income').reduce((s,t)=>s+t.amount,0);
      days.push({exp,inc,hasData:exp>0||inc>0});
    }
    const maxVal=Math.max(...days.map(d=>Math.max(d.exp,d.inc)),1);
    return days.map(d=>({...d,expH:Math.round((d.exp/maxVal)*52)+4,incH:Math.round((d.inc/maxVal)*52)+4}));
  },[txs]);

  return(
    <div className="flex items-end gap-0.5 h-14">
      {data.map((d,i)=>(
        <div key={i} className="flex flex-col items-center gap-0.5 flex-1">
          {d.inc>0&&<div style={{height:Math.min(d.incH,52),background:'#bfdbfe',borderRadius:'2px 2px 0 0',minHeight:4}} className="w-full"/>}
          {d.exp>0&&<div style={{height:Math.min(d.expH,52),background:'#2563eb',borderRadius:'2px 2px 0 0',minHeight:4}} className="w-full"/>}
          {!d.hasData&&<div style={{height:8,background:'#e5e7eb',borderRadius:2}} className="w-full"/>}
        </div>
      ))}
    </div>
  );
};

// AI SMART INPUT BAR
// ═══════════════════════════════════════════════════════════
const AISmartInputBar = ({wallets,onParsed,onOpenSettings}) => {
  const [inputVal,setInputVal]=useState('');
  const [loading,setLoading]=useState(false);
  const [errorMsg,setErrorMsg]=useState('');
  const [selectedImg,setSelectedImg]=useState(null);
  const fileInputRef=useRef(null);
  const hasApiKey=Boolean(GeminiAIService.getKey());

  const samplePrompts=[
    "Ăn trưa 55k bằng tiền mặt, đổ xăng 100k",
    "Nhận lương 15 củ chuyển khoản ngân hàng",
    "Mua đồ Uniqlo 1tr2 quẹt thẻ tín dụng, cà phê 45k"
  ];

  const handleImageSelect=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=(evt)=>{
      const dataUrl=evt.target.result;
      const base64=dataUrl.split(',')[1];
      setSelectedImg({
        file,
        preview:dataUrl,
        base64,
        mimeType:file.type||'image/jpeg'
      });
      setErrorMsg('');
    };
    reader.readAsDataURL(file);
  };

  const handleClearImage=()=>{
    setSelectedImg(null);
    if(fileInputRef.current) fileInputRef.current.value='';
  };

  const handleSubmit=async(e)=>{
    if(e) e.preventDefault();
    if(!inputVal.trim() && !selectedImg){
      setErrorMsg('Vui lòng nhập mô tả hoặc tải ảnh hóa đơn/chuyển khoản');
      return;
    }
    setErrorMsg('');
    setLoading(true);

    try{
      const result=await GeminiAIService.parseTransactions({
        text:inputVal.trim(),
        imageBase64:selectedImg?.base64,
        mimeType:selectedImg?.mimeType,
        wallets,
        categories:CATS
      });

      if(result?.transactions?.length>0){
        onParsed(result.transactions, result.isOfflineDemo);
        setInputVal('');
        handleClearImage();
      }else{
        setErrorMsg('Không tìm thấy giao dịch nào. Hãy thử lại với câu rõ hơn.');
      }
    }catch(err){
      setErrorMsg(err.message||'Lỗi xử lý AI');

      setLoading(false);
    }
  };

  return(
    <div className="card p-5 border border-cyan-100/60 relative overflow-hidden ai-glow">
      <div className="absolute -top-12 -right-12 w-48 h-48 rounded-full bg-gradient-to-br from-teal-400/10 via-cyan-400/10 to-blue-500/10 pointer-events-none blur-2xl"/>

            <Ico name="sparkles" size={15}/>
          </span>
          <span className="text-sm font-bold bg-gradient-to-r from-teal-700 via-cyan-800 to-blue-800 bg-clip-text text-transparent">
            AI Smart Input
          </span>
          <span className="text-[11px] font-semibold bg-cyan-50 text-cyan-700 border border-cyan-200/60 px-2 py-0.5 rounded-full">
            Gemini 2.5 Flash
          </span>
        </div>

        <div className="flex items-center gap-2 text-xs">
          {hasApiKey ? (
            <span className="flex items-center gap-1 text-emerald-600 font-medium bg-emerald-50 px-2.5 py-1 rounded-full border border-emerald-100">
              <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"/>
              API Key đã kết nối
            </span>
          ) : (
            <button onClick={onOpenSettings} className="flex items-center gap-1 text-amber-700 bg-amber-50 hover:bg-amber-100 px-2.5 py-1 rounded-full border border-amber-200 transition-colors">
              <Ico name="key" size={12}/>
              Nhập API Key

        </div>
      </div>

      <form onSubmit={handleSubmit} className="space-y-3">
        <div className="flex items-center gap-2 bg-gray-50/90 border border-gray-200 focus-within:border-cyan-500 focus-within:bg-white rounded-2xl p-1.5 transition-all shadow-inner">
          <div className="pl-3 text-cyan-600">
            <Ico name="sparkles" size={18}/>
          </div>
          <input
            type="text"

            className="flex-1 bg-transparent px-2 py-2 text-sm text-gray-800 placeholder:text-gray-400 outline-none"

            <Ico name="alertCircle" size={14}/>
            <span>{errorMsg}</span>
          </div>

        <div className="flex items-center gap-2 flex-wrap pt-1">
          <span className="text-[11px] font-semibold text-gray-400">Gợi ý mẫu:</span>

// 1. QUẢN LÝ NGÂN SÁCH (BUDGETS PAGE)
// ═══════════════════════════════════════════════════════════
const BudgetsPage = ({txs,budgets,onUpdateBudget}) => {
  const now=new Date();
  const [editingCat,setEditingCat]=useState(null); // cat object
  const [limitInput,setLimitInput]=useState('');

  // Calculate monthly expense for each category
  const expenseCats=CATS.filter(c=>c.type==='expense');
  const monthTxs=txs.filter(t=>{
    const d=new Date(t.date);
    return t.type==='expense' && d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  });

  const budgetStats=expenseCats.map(cat=>{
    const spent=monthTxs.filter(t=>t.categoryId===cat.id).reduce((s,t)=>s+t.amount,0);
    const limit=budgets[cat.id]||0;
    const pct=limit>0?Math.round((spent/limit)*100):0;
    
    // Status & Color Rules:
    // Green (< 75%), Amber (75% - 99%), Red (>= 100%)
    let statusColor='#10b981'; // Green
    let statusBg='bg-emerald-50 text-emerald-700 border-emerald-200';
    let barBg='#10b981';
    let statusText='Tiến độ tốt';

    if(pct>=100){
      statusColor='#ef4444'; // Red
      statusBg='bg-rose-50 text-rose-700 border-rose-200';
      barBg='#ef4444';
      statusText='Vượt hạn mức';
    }else if(pct>=75){
      statusColor='#f59e0b'; // Amber
      statusBg='bg-amber-50 text-amber-700 border-amber-200';
      barBg='#f59e0b';
      statusText='Sắp chạm hạn mức';
    }

    return {
      cat,
      spent,
      limit,
      pct,
      statusColor,
      statusBg,
      barBg,
      statusText,
      over: spent > limit ? spent - limit : 0,
      remaining: limit > spent ? limit - spent : 0
    };
  });

  const totalBudget=Object.values(budgets).reduce((s,v)=>s+(Number(v)||0),0);
  const totalSpent=budgetStats.reduce((s,b)=>s+b.spent,0);
  const totalPct=totalBudget>0?Math.round((totalSpent/totalBudget)*100):0;
  const overBudgetCount=budgetStats.filter(b=>b.pct>=100 && b.limit>0).length;

  const handleOpenEdit=(cat)=>{
    setEditingCat(cat);
    setLimitInput(fmtInput(String(budgets[cat.id]||'')));
  };

  const handleSaveBudget=()=>{
    if(!editingCat)return;
    const val=parseInput(limitInput);
    onUpdateBudget(editingCat.id, val);
    setEditingCat(null);
  };

  return(
    <div className="max-w-screen-xl mx-auto px-6 py-6 fade-up space-y-6">
      {/* Header */}
      <div className="flex items-center justify-between flex-wrap gap-4">
        <div>
          <h2 className="text-2xl font-black text-gray-900">Quản lý Ngân sách</h2>
          <p className="text-gray-400 text-sm">Thiết lập & kiểm soát hạn mức chi tiêu hàng tháng – {monthLabel()}</p>
        </div>
        {overBudgetCount > 0 && (
          <div className="flex items-center gap-2 bg-rose-50 border border-rose-200 px-3.5 py-2 rounded-2xl text-xs font-bold text-rose-700">
            <Ico name="alertTriangle" size={16} color="#ef4444"/>
            <span>Có {overBudgetCount} danh mục đã vượt hạn mức!</span>
          </div>
        )}
      </div>

      {/* Overview Cards */}
      <div className="grid gap-4" style={{gridTemplateColumns:'repeat(auto-fit, minmax(240px, 1fr))'}}>
        <div className="card p-5">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Tổng ngân sách</span>
            <div className="w-8 h-8 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center"><Ico name="target" size={16}/></div>
          </div>
          <p className="text-2xl font-black text-gray-900">{fmtFull(totalBudget)}</p>
          <p className="text-xs text-gray-400 mt-1">{expenseCats.length} danh mục chi tiêu</p>
        </div>

        <div className="card p-5">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Đã chi tháng này</span>
            <div className="w-8 h-8 rounded-xl bg-rose-50 text-rose-600 flex items-center justify-center"><Ico name="arrowUpC" size={16}/></div>
          </div>
          <p className="text-2xl font-black text-rose-600">{fmtFull(totalSpent)}</p>
          <p className="text-xs text-gray-400 mt-1">Chiếm {totalPct}% tổng ngân sách</p>

        <div className="card p-5">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-semibold text-gray-400 uppercase tracking-wider">Còn lại khả dụng</span>
            <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center"><Ico name="wallet" size={16}/></div>
          </div>
          <p className={`text-2xl font-black ${totalBudget>=totalSpent?'text-emerald-600':'text-rose-600'}`}>
            {totalBudget>=totalSpent ? fmtFull(totalBudget-totalSpent) : `-${fmtFull(totalSpent-totalBudget)}`}
          </p>
          <p className="text-xs text-gray-400 mt-1">{totalBudget>=totalSpent?'Trong tầm kiểm soát':'Đã vượt hạn mức tổng'}</p>
        </div>
      </div>

      {/* Main Budget Items Grid */}
      <div className="grid gap-4" style={{gridTemplateColumns:'repeat(auto-fit, minmax(340px, 1fr))'}}>
        {budgetStats.map(item=>{
          return(
            <div key={item.cat.id} className="card p-5 space-y-4 hover:shadow-md transition-shadow relative overflow-hidden">
              {/* Category Header */}
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl flex items-center justify-center" style={{background:item.cat.color+'20'}}>
                    <Ico name={item.cat.icon} size={20} color={item.cat.color}/>
                  </div>
                  <div>
                    <h3 className="font-bold text-gray-800 text-sm">{item.cat.name}</h3>
                    <p className="text-xs text-gray-400">
                      Hạn mức: <span className="font-semibold text-gray-700">{item.limit>0?fmtFull(item.limit):'Chưa đặt'}</span>
                    </p>

                <div className="flex items-center gap-2">
                  <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full border ${item.statusBg}`}>
                    {item.pct}% · {item.statusText}
                  </span>
                  <button
                    onClick={()=>handleOpenEdit(item.cat)}
                    className="p-1.5 rounded-lg hover:bg-gray-100 text-gray-400 hover:text-cyan-700 transition-colors"
                    title="Đặt/sửa hạn mức"
                  >
                    <Ico name="pencil" size={14}/>
                  </button>
                </div>
              </div>

              {/* Progress Bar (Dynamic Colors: Green <75%, Amber 75-99%, Red >=100%) */}
              <div className="space-y-1.5">
                <div className="h-3 bg-gray-100 rounded-full overflow-hidden p-0.5 border border-gray-200/40">
                  <div
                    className="h-full rounded-full transition-all duration-500"
                    style={{
                      width: `${Math.min(item.pct, 100)}%`,
                      background: item.barBg
                    }}
                  />
                </div>

                <div className="flex items-center justify-between text-xs">
                  <span className="text-gray-500">
                    Đã chi: <strong className="text-gray-800">{fmtFull(item.spent)}</strong>
                  </span>
                  {item.over > 0 ? (
                    <span className="font-bold text-rose-600 flex items-center gap-1">
                      <Ico name="alertTriangle" size={12}/> Vượt: +{fmtFull(item.over)}
                    </span>
                  ) : (
                    <span className="text-gray-500">
                      Còn lại: <strong className="text-emerald-600">{fmtFull(item.remaining)}</strong>
                    </span>
                  )}
                </div>
              </div>

              {/* Warning alert box if over budget */}
              {item.pct >= 100 && item.limit > 0 && (
                <div className="p-2.5 rounded-xl bg-rose-50 border border-rose-200/80 text-xs text-rose-700 flex items-center gap-2">
                  <Ico name="alertCircle" size={15}/>
                  <span>Bạn đã vượt <strong>{fmtFull(item.over)}</strong> so với hạn mức đặt ra.</span>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* Edit Budget Modal */}
      {editingCat && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 overflow-y-auto modal-blur" style={{background:'rgba(0,0,0,0.45)', backdropFilter:'blur(8px)', WebkitBackdropFilter:'blur(8px)'}} onClick={e=>e.target===e.currentTarget&&setEditingCat(null)}>
          <div className="bg-white rounded-2xl sm:rounded-3xl shadow-2xl w-full max-w-sm mx-auto my-auto slide-up overflow-hidden p-5 sm:p-6 space-y-4" style={{boxSizing:'border-box'}} onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl flex items-center justify-center" style={{background:editingCat.color+'20'}}>
                  <Ico name={editingCat.icon} size={16} color={editingCat.color}/>
                </div>
                <h3 className="font-bold text-gray-900 text-base">Đặt hạn mức: {editingCat.name}</h3>
              </div>
              <button onClick={()=>setEditingCat(null)} className="p-1 rounded-lg hover:bg-gray-100 text-gray-400">
                <Ico name="x" size={16}/>
              </button>
            </div>

            <div className="space-y-1.5">
              <label className="text-xs font-semibold text-gray-500">Số tiền hạn mức tháng (VNĐ)</label>
              <div className="flex items-center gap-2 border border-gray-200 focus-within:border-cyan-500 rounded-xl px-3.5 py-2.5 bg-gray-50">
                <span className="font-bold text-gray-400">₫</span>
                <input
                  type="text"
                  value={limitInput}
                  onChange={(e)=>setLimitInput(fmtInput(e.target.value))}
                  placeholder="0"
                  className="flex-1 bg-transparent text-lg font-bold outline-none text-gray-800"
                  autoFocus
                />
              </div>
              <p className="text-[11px] text-gray-400">VD: 4.000.000 đ cho chi phí ăn uống cả tháng</p>
            </div>

            <div className="flex gap-2 pt-2">
              <button
                onClick={()=>setEditingCat(null)}
                className="btn-outline flex-1 py-2.5 rounded-xl text-xs font-semibold"
              >
                Hủy
              </button>
              <button
                onClick={handleSaveBudget}
                className="flex-1 py-2.5 rounded-xl text-xs font-bold text-white shadow-md"
                style={{background:'linear-gradient(135deg,#06b6d4,#10b981)'}}
              >
                Lưu hạn mức
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ═══════════════════════════════════════════════════════════
// 2. SAO LƯU DỮ LIỆU & CÀI ĐẶT (SETTINGS PAGE WITH EXPORT/IMPORT & PWA)
// ═══════════════════════════════════════════════════════════
const SettingsPage = ({onResetData,wallets,txs,budgets,onRestoreData}) => {
  const [apiKey,setApiKey]=useState(()=>GeminiAIService.getKey());
  const [showKey,setShowKey]=useState(false);
  const [status,setStatus]=useState({type:'',msg:''});
  const [testing,setTesting]=useState(false);
  const fileImportRef=useRef(null);

  const handleSave=()=>{
    if(!apiKey.trim()){
      GeminiAIService.removeKey();
      setStatus({type:'info',msg:'Đã xóa API Key khỏi bộ nhớ trình duyệt.'});
      return;
    }
    GeminiAIService.setKey(apiKey);
    setStatus({type:'success',msg:'Đã lưu Gemini API Key thành công vào LocalStorage!'});
  };

  const handleTest=async()=>{
    if(!apiKey.trim()){
      setStatus({type:'error',msg:'Vui lòng nhập API Key trước khi kiểm tra.'});
      return;
    }
    setTesting(true);
    setStatus({type:'',msg:''});
    try{
      await GeminiAIService.testKey(apiKey);
      GeminiAIService.setKey(apiKey);
      setStatus({type:'success',msg:'✅ Kết nối thành công tới Gemini 2.5 Flash API (@google/genai)!'});
    }catch(err){
      setStatus({type:'error',msg:`❌ Kiểm tra thất bại: ${err.message}`});
    }finally{
      setTesting(false);
    }
  };

  const handleClear=()=>{
    setApiKey('');
    GeminiAIService.removeKey();
    setStatus({type:'info',msg:'Đã xóa API Key.'});
  };

  // ── CSV EXPORT (Standard UTF-8 BOM for Excel) ──
  const handleExportCSV=()=>{
    if(!txs || txs.length===0){
      alert('Không có giao dịch nào để xuất CSV!');
      return;
    }

    const headers=['"Mã giao dịch"','"Ngày"','"Giờ"','"Loại"','"Danh mục"','"Ví"','"Số tiền (VNĐ)"','"Ghi chú"','"Phương thức"','"Trạng thái"'];
    const rows=txs.map(t=>{
      const cat=getCat(t.categoryId);
      const w=wallets.find(w=>w.id===t.walletId);
      const dateStr=fmtDate(t.date);
      const timeStr=fmtTime(t.date);
      const typeStr=t.type==='income'?'Thu nhập':'Chi tiêu';
      const statusStr=t.status==='done'?'Hoàn thành':t.status==='cancel'?'Đã huỷ':'Chờ xử lý';
      const cleanNote=(t.note||'').replace(/"/g,'""');

      return [
        `"${t.id}"`,
        `"${dateStr}"`,
        `"${timeStr}"`,
        `"${typeStr}"`,
        `"${cat.name}"`,
        `"${w?.name||'—'}"`,
        t.amount,
        `"${cleanNote}"`,
        `"${t.method||'Tiền mặt'}"`,
        `"${statusStr}"`
      ].join(',');
    });

    // UTF-8 BOM: \uFEFF to prevent Excel Mojibake / font error
    const BOM = "\uFEFF";
    const csvContent = BOM + headers.join(',') + '\n' + rows.join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Finix_GiaoDich_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  // ── JSON BACKUP EXPORT ──
  const handleExportJSON=()=>{
    const backupData={
      app: 'Finix',
      version: '1.0',
      exportedAt: new Date().toISOString(),
      wallets: DS.getWallets(),
      transactions: DS.getTransactions(),
      budgets: DS.getBudgets(),
      settings:{
        hasGeminiKey: Boolean(GeminiAIService.getKey())
      }
    };

    const jsonBlob=new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
    const url=URL.createObjectURL(jsonBlob);
    const link=document.createElement('a');
    link.href=url;
    link.download=`Finix_Backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  // ── JSON RESTORE IMPORT ──
  const handleImportJSON=(e)=>{
    const file=e.target.files?.[0];
    if(!file)return;

    const reader=new FileReader();
    reader.onload=(evt)=>{
      try{
        const parsed=JSON.parse(evt.target.result);
        if(!parsed.transactions || !Array.isArray(parsed.transactions)){
          throw new Error('File không chứa danh sách giao dịch hợp lệ');
        }

        if(confirm(`Tìm thấy ${parsed.transactions.length} giao dịch trong file sao lưu. Bạn có muốn khôi phục toàn bộ dữ liệu?`)){
          onRestoreData(parsed);
          alert(`✅ Khôi phục thành công ${parsed.transactions.length} giao dịch!`);
        }
      }catch(err){
        alert(`❌ Lỗi đọc file sao lưu: ${err.message}`);
      }finally{
        if(fileImportRef.current) fileImportRef.current.value='';
      }
    };
    reader.readAsText(file);
  };

  return(
    <div className="max-w-screen-md mx-auto px-6 py-6 fade-up space-y-6">
      <div>
        <h2 className="text-2xl font-black text-gray-900">Cài đặt ứng dụng</h2>
        <p className="text-gray-400 text-sm">Cấu hình Gemini AI, Sao lưu/Khôi phục & Cài đặt PWA</p>
      </div>

      {/* 2. BACKUP & EXPORT/IMPORT SECTION (YÊU CẦU 2) */}
      <div className="card p-6 space-y-5">
        <div className="flex items-center justify-between border-b border-gray-100 pb-3">
          <div className="flex items-center gap-3">
            <span className="w-10 h-10 rounded-xl bg-teal-100 text-teal-700 flex items-center justify-center">
              <Ico name="download" size={20}/>
            </span>
            <div>
              <h3 className="font-bold text-gray-800 text-base">Sao lưu & Xuất dữ liệu</h3>
              <p className="text-xs text-gray-400">Xuất file Excel CSV (chuẩn UTF-8 BOM) và sao lưu an toàn</p>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
          {/* CSV Export Button */}
          <button
            onClick={handleExportCSV}
            className="flex items-center gap-3 p-4 rounded-2xl border-2 border-emerald-100 bg-emerald-50/50 hover:bg-emerald-50 hover:border-emerald-300 transition-all text-left group"
          >
            <div className="w-10 h-10 rounded-xl bg-emerald-500 text-white flex items-center justify-center shadow-sm">
              <Ico name="fileSpreadsheet" size={20}/>
            </div>
            <div>
              <p className="font-bold text-sm text-gray-900 group-hover:text-emerald-700">Xuất CSV (Excel)</p>
              <p className="text-xs text-gray-500">Chuẩn UTF-8 BOM, không lỗi font tiếng Việt</p>
            </div>
          </button>

          {/* JSON Backup Button */}
          <button
            onClick={handleExportJSON}
            className="flex items-center gap-3 p-4 rounded-2xl border-2 border-cyan-100 bg-cyan-50/50 hover:bg-cyan-50 hover:border-cyan-300 transition-all text-left group"
          >
            <div className="w-10 h-10 rounded-xl bg-cyan-600 text-white flex items-center justify-center shadow-sm">
              <Ico name="download" size={20}/>
            </div>
            <div>
              <p className="font-bold text-sm text-gray-900 group-hover:text-cyan-700">Sao lưu dữ liệu (JSON)</p>
              <p className="text-xs text-gray-500">Bao gồm ví, ngân sách & lịch sử</p>
            </div>
          </button>
        </div>

        {/* JSON Import Section */}
        <div className="pt-2 border-t border-gray-100">
          <input
            ref={fileImportRef}
            type="file"
            accept=".json"
            onChange={handleImportJSON}
            className="hidden"
          />
          <button
            onClick={()=>fileImportRef.current?.click()}
            className="w-full flex items-center justify-center gap-2 py-3 rounded-xl border border-dashed border-gray-300 hover:border-cyan-500 bg-gray-50 hover:bg-cyan-50/30 text-xs font-bold text-gray-700 hover:text-cyan-800 transition-all"
          >
            <Ico name="uploadCloud" size={16}/>
            Khôi phục dữ liệu từ file sao lưu (.json)
          </button>
        </div>
      </div>

      {/* 3. PWA APP CONFIGURATION CARD (YÊU CẦU 3) */}
      <div className="card p-6 space-y-4">
        <div className="flex items-center justify-between border-b border-gray-100 pb-3">
          <div className="flex items-center gap-3">
            <span className="w-10 h-10 rounded-xl bg-cyan-100 text-cyan-700 flex items-center justify-center">
              <Ico name="smartphone" size={20}/>
            </span>
            <div>
              <h3 className="font-bold text-gray-800 text-base">Ứng dụng PWA (Progressive Web App)</h3>
              <p className="text-xs text-gray-400">Trải nghiệm toàn màn hình như ứng dụng gốc trên iOS & Android</p>
            </div>
          </div>
          <span className="text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
            Sẵn sàng
          </span>
        </div>

        <div className="bg-gray-50 p-4 rounded-2xl border border-gray-100 text-xs text-gray-600 space-y-2">
          <p className="font-bold text-gray-800">Cách cài đặt Finix lên điện thoại:</p>
          <ul className="list-disc list-inside space-y-1 text-gray-500 pl-1 leading-relaxed">
            <li><strong>iPhone/iPad (Safari):</strong> Bấm nút <em>Chia sẻ (Share)</em> ở thanh dưới ➔ Chọn <strong>"Thêm vào Màn hình chính" (Add to Home Screen)</strong>.</li>
            <li><strong>Android (Chrome):</strong> Bấm menu <em>3 chấm</em> ở góc trên ➔ Chọn <strong>"Cài đặt ứng dụng"</strong> hoặc <strong>"Thêm vào Màn hình chính"</strong>.</li>
            <li>Ứng dụng sẽ hoạt động ở chế độ <strong>Standalone toàn màn hình</strong> và hỗ trợ lưu trữ offline mượt mà.</li>
          </ul>
        </div>
      </div>

      {/* GEMINI AI CONFIG */}
      <div className="card p-6 space-y-5">
        <div className="flex items-center justify-between border-b border-gray-100 pb-4">
          <div className="flex items-center gap-3">
            <span className="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-400 to-cyan-600 flex items-center justify-center text-white shadow-sm shadow-cyan-200">
              <Ico name="sparkles" size={20}/>
            </span>
            <div>
              <h3 className="font-bold text-gray-800 text-base">Google Gemini API</h3>
              <p className="text-xs text-gray-400">Model: <code className="bg-gray-100 text-cyan-800 px-1.5 py-0.5 rounded font-mono">gemini-2.5-flash</code></p>
            </div>
          </div>
          <span className="text-xs font-semibold px-3 py-1 rounded-full bg-cyan-50 text-cyan-700 border border-cyan-200">
            Miễn phí
          </span>
        </div>

        <div className="space-y-3">
          <label className="text-xs font-semibold text-gray-600 block">
            Gemini API Key của bạn
          </label>
          <div className="flex items-center gap-2 border border-gray-200 focus-within:border-cyan-500 rounded-xl px-3 py-2 bg-gray-50/50">
            <Ico name="key" size={16} color="#9ca3af"/>
            <input
              type={showKey?'text':'password'}
              value={apiKey}
              onChange={(e)=>{setApiKey(e.target.value);setStatus({type:'',msg:''});}}
              placeholder="Dán AI Studio API Key (AIzaSy...)"
              className="flex-1 bg-transparent text-sm font-mono text-gray-800 outline-none"
            />
            <button
              type="button"
              onClick={()=>setShowKey(!showKey)}
              className="text-gray-400 hover:text-gray-600 p-1"
            >
              <Ico name={showKey?'eyeOff':'eye'} size={16}/>
            </button>
          </div>

          <div className="flex items-center gap-2 pt-2 flex-wrap">
            <button
              onClick={handleSave}
              className="px-5 py-2.5 rounded-xl text-xs font-bold text-white shadow-sm transition-all"
              style={{background:'linear-gradient(135deg,#06b6d4,#10b981)'}}
            >
              Lưu API Key
            </button>
            <button
              onClick={handleTest}
              disabled={testing}
              className="btn-outline flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-xs font-semibold"
            >
              {testing ? <Ico name="loader" size={14}/> : <Ico name="check" size={14}/>}
              <span>{testing?'Đang kiểm tra...':'Kiểm tra kết nối'}</span>
            </button>
            {apiKey && (
              <button
                onClick={handleClear}
                className="px-4 py-2.5 rounded-xl text-xs font-semibold text-red-500 hover:bg-red-50 transition-colors"
              >
                Xóa Key
              </button>
            )}
          </div>

          {status.msg && (
            <div className={`p-3 rounded-xl text-xs flex items-center gap-2 ${status.type==='success'?'bg-emerald-50 text-emerald-700 border border-emerald-200':status.type==='error'?'bg-red-50 text-red-600 border border-red-200':'bg-blue-50 text-blue-700 border border-blue-200'}`}>
              <Ico name={status.type==='success'?'check':'info'} size={15}/>
              <span>{status.msg}</span>
            </div>
          )}
        </div>
      </div>

      {/* Reset Data */}
      <div className="card p-6 space-y-4">
        <h3 className="font-bold text-gray-800 text-base border-b border-gray-100 pb-3">Dữ liệu gốc</h3>
        <p className="text-xs text-gray-400">Khôi phục 20 giao dịch và 3 ví mặc định ban đầu.</p>
        <button
          onClick={()=>{
            if(confirm('Khôi phục dữ liệu mẫu ban đầu?')){
              onResetData();
              alert('Đã khôi phục dữ liệu mẫu!');
            }
          }}
          className="btn-outline px-4 py-2.5 rounded-xl text-xs font-semibold text-gray-700 hover:text-red-600"
        >
          Khôi phục dữ liệu mẫu
        </button>
      </div>
    </div>
  );
};

// QUICK ADD MANUAL MODAL
// ═══════════════════════════════════════════════════════════
const Modal = ({wallets,onClose,onSave,editTx}) => {
  const [type,setType]=useState(editTx?.type||'expense');
  const [amount,setAmount]=useState(editTx?fmtInput(String(editTx.amount)):'');
  const [catId,setCatId]=useState(editTx?.categoryId||'exp_food');
  const [walletId,setWalletId]=useState(editTx?.walletId||wallets[0]?.id||'w1');
  const [note,setNote]=useState(editTx?.note||'');
  const [dateStr,setDateStr]=useState(editTx?editTx.date.slice(0,16):new Date().toISOString().slice(0,16));
  const [err,setErr]=useState('');
  const cats=CATS.filter(c=>c.type===type);
  useEffect(()=>{if(!editTx)setCatId(type==='income'?'inc_salary':'exp_food');},[type]);
  const save=()=>{
    const amt=parseInput(amount);
    if(!amt||amt<=0)return setErr('Nhập số tiền hợp lệ');

            <input type="text" placeholder="Mô tả giao dịch..." value={note} onChange={e=>setNote(e.target.value)}
              className="w-full border border-gray-200 rounded-xl px-3.5 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm outline-none focus:border-cyan-400 placeholder:text-gray-300 min-w-0 box-border"/>
          </div>
          <div>
            <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1.5">Ngày giờ</p>
            <input type="datetime-local" value={dateStr} onChange={e=>setDateStr(e.target.value)}

              style={{maxWidth:'100%'}}/>
          </div>
          {err&&<p className="text-red-500 text-xs sm:text-sm font-medium">{err}</p>}

            {editTx?'Cập nhật':'Lưu giao dịch'}
          </button>
        </div>
      </div>
    </div>
  );
};

  const monthTxs=txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  const prevMonthTxs=txs.filter(t=>{const d=new Date(t.date);return d.getMonth()===(now.getMonth()-1+12)%12&&d.getFullYear()===(now.getMonth()===0?now.getFullYear()-1:now.getFullYear());});

  const totalBal=wallets.reduce((s,w)=>s+w.balance,0);
  const totalInc=monthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const totalExp=monthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const prevInc=prevMonthTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const prevExp=prevMonthTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const incChange=prevInc>0?((totalInc-prevInc)/prevInc*100).toFixed(1):0;
  const expChange=prevExp>0?((totalExp-prevExp)/prevExp*100).toFixed(1):0;

  const expByCat=useMemo(()=>{
    const m={};
    monthTxs.filter(t=>t.type==='expense').forEach(t=>{
      const c=getCat(t.categoryId);
      if(!m[c.id])m[c.id]={...c,total:0};
      m[c.id].total+=t.amount;
    });
    return Object.values(m).sort((a,b)=>b.total-a.total);
  },[monthTxs]);

  const incByCat=useMemo(()=>{
    const m={};
    monthTxs.filter(t=>t.type==='income').forEach(t=>{
      const c=getCat(t.categoryId);
      if(!m[c.id])m[c.id]={...c,total:0};
      m[c.id].total+=t.amount;
    });
    return Object.values(m).sort((a,b)=>b.total-a.total);
  },[monthTxs]);

  const recentTxs=useMemo(()=>txs.filter(t=>!search||t.note?.toLowerCase().includes(search.toLowerCase())).slice(0,10),[txs,search]);
  const methodIcon=m=>m?.includes('Thẻ')?'creditCard':m?.includes('khoản')?'landmark':'wallet';

  return(
    <div className="max-w-screen-xl mx-auto px-6 py-6 space-y-5 fade-up">

              <span className="font-semibold text-gray-700">Số dư của tôi</span>
            </div>
            <div className="flex items-center gap-2">
              <span className="text-xs text-gray-400 border border-gray-200 px-2.5 py-1 rounded-full">VNĐ</span>

            </div>
          </div>
          <div className="flex items-start justify-between mb-3">
            <div>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-3xl font-black text-gray-900">{showBal?fmtFull(totalBal):'••••••'}</span>

              <div className="flex items-center gap-1.5">
                <span className="w-4 h-4 rounded-full bg-emerald-500 flex items-center justify-center"><Ico name="trendUp" size={10} color="white"/></span>
                <span className="text-xs text-emerald-600 font-medium">+12% số dư tăng, quản lý tốt.</span>
              </div>
            </div>
            <div className="mt-1"><MiniBalanceChart txs={txs}/></div>
          </div>
          <div className="flex gap-2 mb-4 overflow-x-auto no-scroll">
            {wallets.map(w=>(
              <div key={w.id} className="flex-1 min-w-[90px] bg-gray-50 rounded-xl p-2.5">

const Analytic = ({txs,wallets}) => {

    <div className="max-w-screen-xl mx-auto px-6 py-6 fade-up">

            <span className="flex items-center gap-1.5 text-xs text-gray-500"><span className="w-3 h-3 rounded bg-lime-400"/>Chi tiêu</span>

        <div className="space-y-4">
          <div className="card p-5">
            <h3 className="font-semibold text-gray-700 mb-4">Chi tiêu theo danh mục</h3>

// ═══════════════════════════════════════════════════════════
// REPORT PAGE
// ═══════════════════════════════════════════════════════════
const Report = ({txs,wallets}) => {
  const now=new Date();
  const months=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  const summary=useMemo(()=>{
    return months.map((ml,mi)=>{
      const mTxs=txs.filter(t=>new Date(t.date).getMonth()===mi&&new Date(t.date).getFullYear()===now.getFullYear());
      const inc=mTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const exp=mTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      return{month:ml,inc,exp,net:inc-exp};
    });
  },[txs]);
  const totalInc=summary.reduce((s,m)=>s+m.inc,0);
  const totalExp=summary.reduce((s,m)=>s+m.exp,0);
  return(
    <div className="max-w-screen-xl mx-auto px-6 py-6 fade-up">
      <div className="mb-6"><h2 className="text-2xl font-black text-gray-900">Báo cáo tài chính {now.getFullYear()}</h2></div>
      <div className="grid gap-4 mb-5" style={{gridTemplateColumns:'repeat(auto-fit, minmax(260px, 1fr))'}}>
        {[{l:'Tổng thu nhập',v:totalInc,c:'#10b981',bg:'#dcfce7',icon:'arrowDownC'},{l:'Tổng chi tiêu',v:totalExp,c:'#ef4444',bg:'#fee2e2',icon:'arrowUpC'},{l:'Tiết kiệm ròng',v:totalInc-totalExp,c:totalInc>totalExp?'#0d9488':'#ef4444',bg:totalInc>totalExp?'#ccfbf1':'#fee2e2',icon:'wallet'}].map((s,i)=>(
          <div key={i} className="card p-5 flex items-center gap-4">
            <div className="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style={{background:s.bg}}><Ico name={s.icon} size={22} color={s.c}/></div>
            <div><p className="text-xs text-gray-400 mb-0.5">{s.l}</p><p className="text-2xl font-black" style={{color:s.c}}>{fmtVND(s.v)}</p></div>
          </div>
        ))}
      </div>
      <div className="card overflow-hidden">
        <div className="px-5 py-4 border-b border-gray-100"><h3 className="font-semibold text-gray-700">Báo cáo theo tháng – {now.getFullYear()}</h3></div>
        <table className="w-full">
          <thead><tr style={{background:'#f9fafb'}} className="border-b border-gray-100">
            <th className="text-left text-xs font-semibold text-gray-400 uppercase px-5 py-3">Tháng</th>
            <th className="text-right text-xs font-semibold text-gray-400 uppercase px-4 py-3">Thu nhập</th>
            <th className="text-right text-xs font-semibold text-gray-400 uppercase px-4 py-3">Chi tiêu</th>
            <th className="text-right text-xs font-semibold text-gray-400 uppercase px-4 py-3">Chênh lệch</th>
            <th className="px-5 py-3 text-left text-xs font-semibold text-gray-400 uppercase">Tình trạng</th>
          </tr></thead>
          <tbody className="divide-y divide-gray-50">
            {summary.map((m,i)=>(
              <tr key={i} className={`hover:bg-gray-50 transition-colors ${i===now.getMonth()?'bg-teal-50/40':''}`}>
                <td className="px-5 py-3"><div className="flex items-center gap-2"><span className="text-sm font-semibold text-gray-800">{m.month}</span>{i===now.getMonth()&&<span className="text-xs bg-cyan-100 text-cyan-800 px-2 py-0.5 rounded-full font-semibold">Hiện tại</span>}</div></td>
                <td className="px-4 py-3 text-right"><span className="text-sm font-bold text-emerald-600">{m.inc>0?fmtVND(m.inc):'—'}</span></td>
                <td className="px-4 py-3 text-right"><span className="text-sm font-bold text-red-500">{m.exp>0?fmtVND(m.exp):'—'}</span></td>
                <td className="px-4 py-3 text-right"><span className={`text-sm font-bold ${m.net>0?'text-teal-700':m.net<0?'text-red-500':'text-gray-400'}`}>{m.inc>0||m.exp>0?(m.net>=0?'+':'')+fmtVND(m.net):'—'}</span></td>
                <td className="px-5 py-3">{m.inc===0&&m.exp===0?<span className="text-xs text-gray-300">—</span>:m.net>0?<span className="status-done">Dư</span>:m.net<0?<span className="status-cancel">Thâm hụt</span>:<span className="status-pending">Hòa vốn</span>}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
};

// ═══════════════════════════════════════════════════════════
// APP ROOT
// ═══════════════════════════════════════════════════════════
const App = () => {
  const [page,setPage]=useState('dashboard');
  const [wallets,setWallets]=useState(()=>DS.getWallets());
  const [txs,setTxs]=useState(()=>DS.getTransactions());
  const [budgets,setBudgets]=useState(()=>DS.getBudgets());
  const [modal,setModal]=useState(false);
  const [editTx,setEditTx]=useState(null);
  const [aiPreviewData,setAiPreviewData]=useState(null);

  // Register PWA Service Worker
  useEffect(()=>{
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('/sw.js').then(reg=>{
          console.log('Finix PWA registered:', reg.scope);
        }).catch(err=>{
          console.warn('PWA registration warning:', err);
        });
      });
    }
  },[]);

  const handleSave=useCallback(tx=>{
    if(tx.id){const r=DS.updateTx(tx,wallets);setTxs([...r.txs]);setWallets([...r.wallets]);}
    else{const r=DS.addTx(tx,wallets);setTxs([r.tx,...txs]);setWallets([...r.wallets]);}
  },[wallets,txs]);

  const handleBatchSaveAI=useCallback((batchList)=>{
    const r=DS.addBatchTxs(batchList,wallets);
    setTxs([...r.txs]);
    setWallets([...r.wallets]);
    setAiPreviewData(null);
  },[wallets]);

  const handleDelete=useCallback(id=>{
    if(!window.confirm('Xóa giao dịch này?'))return;
    const r=DS.deleteTx(id,wallets);setTxs([...r.txs]);setWallets([...r.wallets]);
  },[wallets]);

  const handleUpdateBudget=useCallback((catId, limit)=>{
    const updated={...budgets, [catId]: limit};
    DS.saveBudgets(updated);
    setBudgets(updated);
  },[budgets]);

  const handleResetData=useCallback(()=>{
    localStorage.removeItem('ff_v2_txs');
    localStorage.removeItem('ff_v2_wallets');
    localStorage.removeItem('ff_v2_budgets');
    const newWs=DS.getWallets();
    const newTs=DS.getTransactions();
    const newBs=DS.getBudgets();
    setWallets([...newWs]);
    setTxs([...newTs]);
    setBudgets({...newBs});
  },[]);

  const handleRestoreData=useCallback((backup)=>{
    if(backup.wallets) { DS.saveWallets(backup.wallets); setWallets([...backup.wallets]); }
    if(backup.transactions) { DS.saveTxs(backup.transactions); setTxs([...backup.transactions]); }
    if(backup.budgets) { DS.saveBudgets(backup.budgets); setBudgets({...backup.budgets}); }
  },[]);

  const handleEdit=useCallback(tx=>{setEditTx(tx);setModal(true);},[]);
  const openAdd=()=>{setEditTx(null);setModal(true);};

  return(
    <div style={{minHeight:'100vh',background:'#f0f2f5'}}>
      <Navbar page={page} setPage={setPage} onAdd={openAdd}/>

      {page==='dashboard'&& (
        <Dashboard
          txs={txs}
          wallets={wallets}
          budgets={budgets}
          onAdd={openAdd}
          onEdit={handleEdit}
          onDelete={handleDelete}
          onParsedAI={(list,isOfflineDemo)=>setAiPreviewData({list,isOfflineDemo})}
          onOpenSettings={()=>setPage('settings')}
          onGoToBudgets={()=>setPage('budgets')}
        />
      )}

      {page==='budgets'  && (
        <BudgetsPage
          txs={txs}
          budgets={budgets}
          onUpdateBudget={handleUpdateBudget}
        />
      )}

      {page==='analytic' &&<Analytic  txs={txs} wallets={wallets}/>}
      {page==='history'  &&<History   txs={txs} wallets={wallets} onEdit={handleEdit} onDelete={handleDelete}/>}
      {page==='report'   &&<Report    txs={txs} wallets={wallets}/>}
      {page==='settings' && (
        <SettingsPage
          onResetData={handleResetData}
          wallets={wallets}
          txs={txs}
          budgets={budgets}
          onRestoreData={handleRestoreData}
        />
      )}

      {modal&&<Modal wallets={wallets} onClose={()=>{setModal(false);setEditTx(null);}} onSave={handleSave} editTx={editTx}/>}

      {aiPreviewData && (
        <AIConfirmationModal
          parsedList={aiPreviewData.list}
          isOfflineDemo={aiPreviewData.isOfflineDemo}
          wallets={wallets}
          onClose={()=>setAiPreviewData(null)}
          onConfirm={handleBatchSaveAI}
        />
      )}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
